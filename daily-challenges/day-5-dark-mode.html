
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Toggle</title>

    <style>
        body {
            background-color: white;
            color: black;
            font-family: Arial, sans-serif;
            padding: 30px;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background-color: #222222;
            color: white;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>My Dark Mode Demo</h1>

    <p>Click the button to switch between light mode and dark mode.</p>

    <button id="theme-toggle">Turn Dark Mode On</button>

    <script>
        const button = document.querySelector("#theme-toggle");

        button.addEventListener("click", function () {
            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {
                button.textContent = "Turn Light Mode On";
            } else {
                button.textContent = "Turn Dark Mode On";
            }
        });
    </script>
</body>
</html>
