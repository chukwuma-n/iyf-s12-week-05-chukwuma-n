
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Heading Colours</title>
</head>
<body>
    <h1>My First Heading</h1>
    <h2>Learning JavaScript</h2>
    <h3>Practising the DOM</h3>
    <button id="change-colors">Change Heading Colours</button>

    <script>
        const headings = document.querySelectorAll("h1, h2, h3");
        const button = document.querySelector("#change-colors");

        button.addEventListener("click", function () {
            headings.forEach(function (heading) {
                const red = Math.floor(Math.random() * 256);
                const green = Math.floor(Math.random() * 256);
                const blue = Math.floor(Math.random() * 256);

                heading.style.color = `rgb(${red}, ${green}, ${blue})`;
            });
        });
    </script>
</body>
</html>
