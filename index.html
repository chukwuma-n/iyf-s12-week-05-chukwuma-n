
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>My To-Do List</h1>
        <p>Organise your tasks, one step at a time.</p>
    </header>

    <main>
        <section id="todo-app">
            <h2>My Tasks</h2>

            <form id="todo-form">
                <label for="todo-input">Enter a task</label>
                <input
                    type="text"
                    id="todo-input"
                    placeholder="What do you need to do?"
                >
                <button type="submit">Add Task</button>
            </form>

            <p id="items-left">0 items left</p>

            <div id="todo-filters">
                <button type="button" data-filter="all">All</button>
                <button type="button" data-filter="active">Active</button>
                <button type="button" data-filter="completed">Completed</button>
            </div>

            <ul id="todo-list"></ul>

            <button type="button" id="clear-completed">
                Clear Completed
            </button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
